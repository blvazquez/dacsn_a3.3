services:

  tienda:
    image: prestashop/prestashop:8.2
    container_name: tienda
    restart: unless-stopped
    ports:
      - "${PUERTO:-8080}:80"
    environment:
      DB_SERVER: bd
      DB_NAME: ${NOMBRE_BD}
      DB_USER: ${USUARIO_BD}
      DB_PASSWD: ${PASSWORD_BD}

      PS_INSTALL_AUTO: 1
      PS_DOMAIN: ${DIRECCION}:${PUERTO:-8080}
      PS_LANGUAGE: es
      PS_COUNTRY: ES
      PS_DEMO_MODE: 0
      PS_FOLDER_ADMIN: admin-tienda
      PS_FOLDER_INSTALL: install-tienda

      ADMIN_MAIL: ${CORREO_ADMIN}
      ADMIN_PASSWD: ${PASSWORD_ADMIN}
    volumes:
      - tienda-ficheros:/var/www/html
    networks:
      - interna
    depends_on:
      bd:
        condition: service_healthy
      correo:
        condition: service_started

  bd:
    image: mariadb:11.8
    container_name: bd
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${NOMBRE_BD}
      MARIADB_USER: ${USUARIO_BD}
      MARIADB_PASSWORD: ${PASSWORD_BD}
      MARIADB_ROOT_PASSWORD: ${PASSWORD_BD}
    volumes:
      - tienda-bd:/var/lib/mysql
    networks:
      - interna
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  correo:
    image: axllent/mailpit:latest
    container_name: correo
    restart: unless-stopped
    ports:
      - "${PUERTO_CORREO:-8025}:8025"
    networks:
      - interna

  adminer:
    image: adminer:5
    container_name: adminer
    restart: unless-stopped
    ports:
      - "${PUERTO_ADMINER:-8081}:8080"
    networks:
      - interna
    profiles:
      - herramientas

volumes:
  tienda-ficheros:
  tienda-bd:

networks:
  interna:
    name: interna
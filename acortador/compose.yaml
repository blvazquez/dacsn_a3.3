services:
  web:
    image: nginx:1.30
    ports:
      - "${PUERTO:-8080}:80"
    networks:
      - frontal
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - codigo:/var/www/html:ro
    depends_on:
      - yourls

  yourls:
    image: yourls:1.10.6-fpm
    networks:
      - frontal
      - interna
    volumes:
      - codigo:/var/www/html
    environment:
      YOURLS_SITE: ${DIRECCION:?Falta definir DIRECCION}
      YOURLS_USER: ${YOURLS_USUARIO:-admin}
      YOURLS_PASS: ${YOURLS_PASSWORD:?Falta definir YOURLS_PASSWORD}
      YOURLS_DB_HOST: bd
      YOURLS_DB_NAME: ${BD_NOMBRE:-yourls}
      YOURLS_DB_USER: ${BD_USUARIO:-yourls}
      YOURLS_DB_PASS: ${BD_PASSWORD:?Falta definir BD_PASSWORD}
    depends_on:
      bd:
        condition: service_healthy

  bd:
    image: mariadb:11.8
    networks:
      - interna
    volumes:
      - datos_bd:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${BD_NOMBRE:-yourls}
      MARIADB_USER: ${BD_USUARIO:-yourls}
      MARIADB_PASSWORD: ${BD_PASSWORD:?Falta definir BD_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  frontal:
  interna:

volumes:
  codigo:
  datos_bd: